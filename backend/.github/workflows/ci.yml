# Photo Captioner Backend - CI Workflow
# Runs on push and pull requests to verify code quality

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linter
        working-directory: backend
        run: npm run lint

      - name: Run type check
        working-directory: backend
        run: npm run typecheck

      - name: Run tests
        working-directory: backend
        run: npm test
        env:
          NODE_ENV: test

      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        if: success()
        with:
          directory: backend/coverage
          fail_ci_if_error: false

  # Docker build job - runs on push to main/develop only
  # TODO: Add docker push to registry when secrets are configured
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: photo-captioner-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TODO: Uncomment and configure when deploying to Cloud Run
